# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: ekans/courir-prototype
  branch: main

site_url: https://ekans.github.io/courir-prototype/
display_url: https://ekans.github.io/courir-prototype/

media_folder: /photos
public_folder: /photos

singletons:
  - name: accueil
    label: Accueil et pied de page
    file: /_data/accueil.yml
    fields:
      - { name: titre, label: Titre }
      - { name: chapo, label: Chapeau, widget: text }
      - { name: bouton, label: Texte du bouton, hint: "Le bouton ouvre un mail vers l'adresse du club, rubrique Bureau." }
      - { name: photo, label: Photo, widget: image }
      - { name: photo_alt, label: Description de la photo, hint: "Lue par les lecteurs d'écran. Décrire ce que montre la photo." }
      - name: pied
        label: Pied de page
        widget: list
        field: { name: ligne, label: Ligne }

  - name: presentation
    label: Présentation
    file: /_data/presentation.yml
    fields:
      - { name: titre, label: Titre }
      - name: paragraphes
        label: Paragraphes
        label_singular: Paragraphe
        widget: list
        field: { name: paragraphe, label: Paragraphe, widget: text }

  - name: lieux
    label: Lieux
    file: /_data/lieux.yml
    fields:
      - { name: titre, label: Titre }
      - { name: intro, label: Introduction, widget: text }
      - { name: sans_js, label: Texte sans JavaScript, widget: text, hint: "Affiché seulement si le navigateur n'exécute pas le JavaScript." }
      - name: lieux
        label: Lieux
        label_singular: Lieu
        widget: list
        hint: L'ordre de cette liste est l'ordre d'affichage. Le premier lieu est sélectionné à l'ouverture de la page.
        field: { name: lieu, label: Lieu }

  - name: parcours
    label: Parcours
    file: /_data/parcours.yml
    fields:
      - name: parcours
        label: Parcours
        label_singular: Parcours
        widget: list
        summary: '{{km}} km. {{description}}'
        fields:
          - { name: km, label: Distance (km), widget: number, value_type: int, min: 1 }
          - { name: description, label: Description, widget: text }
          - { name: openrunner, label: Numéro OpenRunner, widget: number, value_type: int, hint: "Le nombre après id= dans l'adresse du parcours sur openrunner.com." }
          - name: lieux
            label: Lieux traversés
            widget: relation
            collection: _singletons
            file: lieux
            value_field: lieux.*
            multiple: true
            min: 1

  - name: semaine
    label: Sorties de la semaine
    file: /_data/semaine.yml
    fields:
      - { name: titre, label: Titre }
      - name: sorties
        label: Sorties
        label_singular: Sortie
        widget: list
        summary: '{{quand}}'
        fields:
          - { name: quand, label: Jour et heure }
          - { name: texte, label: Texte, widget: text }

  - name: balade
    label: Balade de la Saune
    file: /_data/balade.yml
    fields:
      - { name: titre, label: Titre }
      - { name: date, label: Édition et date }
      - { name: texte, label: Texte, widget: text }
      - { name: site, label: Adresse du site de la course }
      - { name: bouton, label: Texte du bouton }
      - { name: affiche, label: Affiche, widget: image }
      - { name: affiche_alt, label: Description de l'affiche }

  - name: adhesion
    label: Adhésion
    file: /_data/adhesion.yml
    fields:
      - { name: titre, label: Titre }
      - name: tarifs
        label: Tarifs
        label_singular: Tarif
        widget: list
        summary: '{{libelle}} : {{prix}} €'
        fields:
          - { name: libelle, label: Libellé }
          - { name: prix, label: Prix (€), widget: number, value_type: int, min: 0 }
      - { name: texte, label: Texte, widget: text }
      - { name: saison, label: Saison, hint: "Par exemple 2026-2027. Affichée dans le lien du bulletin." }
      - { name: bulletin, label: Bulletin d'adhésion (PDF), widget: file, media_folder: /documents, public_folder: /documents }
      - { name: trombinoscope, label: Trombinoscope, widget: image }
      - { name: paiement, label: "Étape 2, paiement", widget: text }
      - { name: remise, label: "Étape 4, à qui remettre le dossier", widget: text }

  - name: bureau
    label: Bureau
    file: /_data/bureau.yml
    fields:
      - { name: titre, label: Titre }
      - name: membres
        label: Membres
        label_singular: Membre
        widget: list
        summary: '{{nom}}, {{role}}'
        fields:
          - { name: nom, label: Nom }
          - { name: role, label: Rôle }
          - { name: telephone, label: Téléphone, required: false, hint: "Au format 06 12 34 56 78. Laisser vide pour ne pas afficher de numéro." }
      - { name: email, label: Adresse mail du club, hint: "Utilisée aussi par le bouton de l'accueil." }
      - name: texte
        label: Texte
        widget: markdown
        minimal: true
        buttons: [bold, italic, link]
        editor_components: []
        modes: [rich_text]
