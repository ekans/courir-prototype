# Publishes each same-repo pull request to gh-pages/pr-preview/pr-<N>/,
# posts the link as one PR comment kept up to date, and removes the preview
# when the PR is closed or merged.
name: Aperçu de la PR

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: apercu-pr-${{ github.event.number }}
  cancel-in-progress: false

env:
  PREVIEW_DIR: pr-preview/pr-${{ github.event.number }}
  PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/

jobs:
  apercu:
    # A fork PR gets a read-only token, so the push to gh-pages would fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Construire le site avec Jekyll
        if: github.event.action != 'closed'
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13

      - name: Publier l'aperçu
        if: github.event.action != 'closed'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: _site
          target-folder: ${{ env.PREVIEW_DIR }}
          force: false
          commit-message: "Aperçu de la PR #${{ github.event.number }}"

      # Deploying an empty folder with clean enabled empties the target folder.
      # The preview must not contain a .nojekyll: the deploy action never deletes
      # one that the source folder lacks. The one at the gh-pages root covers it.
      - name: Préparer un dossier vide
        if: github.event.action == 'closed'
        run: mkdir -p "$RUNNER_TEMP/vide"

      - name: Supprimer l'aperçu
        if: github.event.action == 'closed'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: ${{ runner.temp }}/vide
          target-folder: ${{ env.PREVIEW_DIR }}
          clean: true
          force: false
          commit-message: "Supprime l'aperçu de la PR #${{ github.event.number }}"

      - name: Mettre à jour le commentaire
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- pr-preview -->';
            const closed = context.payload.action === 'closed';
            const body = closed
              ? `${marker}\nAperçu supprimé : la PR est fermée.`
              : `${marker}\nAperçu de cette PR : ${process.env.PREVIEW_URL}\n(mis à jour à chaque push, en ligne ~1 min après)`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find(
              (c) => c.user.login === 'github-actions[bot]' && c.body.includes(marker),
            );

            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else if (!closed) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
