titre: Les lieux où l'on court
intro: Nos quatorze parcours passent par ces lieux. Choisissez-en un pour voir les parcours qui le traversent. Tous partent de la salle Patrick Pépi.
sans_js: Les quatorze parcours du club, de 4 à 21 km, sont sur OpenRunner sous le nom « CourirFonsegrives ».
